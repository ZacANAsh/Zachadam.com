<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zach Adam — Writer, Composer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..900;1,400..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    html, body { margin: 0; padding: 0; background: #385860; color: #e8d8d0; font-family: 'Source Serif 4', Georgia, serif; }
    * { box-sizing: border-box; }
    body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    a { color: inherit; }
    /* Keep the bg of the page matching the paper outside the 1440 max-width */
    html { background: #385860; }
    body { overflow-x: hidden; }

    /* ---------- TABLET (≤980px) ---------- */
    @media (max-width: 980px) {
      /* tighten horizontal padding across all sections */
      nav > div { padding-left: 24px !important; padding-right: 24px !important; }
      section, footer { padding-left: 24px !important; padding-right: 24px !important; }
      section > div { padding-left: 24px !important; padding-right: 24px !important; }
      /* collapse every 2/3-col grid */
      [style*="grid-template-columns"] {
        grid-template-columns: 1fr !important;
        gap: 36px !important;
      }
      /* scale down monstrous display type */
      h2 { font-size: 72px !important; line-height: 0.95 !important; }
      h3 { font-size: 56px !important; line-height: 0.95 !important; }
      blockquote { font-size: 32px !important; line-height: 1.22 !important; }
    }

    /* ---------- PHONE (≤640px) ---------- */
    @media (max-width: 640px) {
      nav > div { padding: 14px 18px !important; }
      /* hide the in-nav logo so the 4 links fit; the masthead logo is right below */
      nav a:first-child { display: none !important; }
      nav a { font-size: 11px !important; letter-spacing: .14em !important; }
      nav > div > div { gap: 14px !important; flex-wrap: wrap !important; justify-content: flex-end !important; }

      section, footer { padding-left: 18px !important; padding-right: 18px !important; }
      section > div { padding-left: 18px !important; padding-right: 18px !important; }

      /* masthead */
      h2 { font-size: 48px !important; }
      h3 { font-size: 40px !important; }
      blockquote { font-size: 24px !important; margin-top: 24px !important; }

      /* roles row — let it wrap nicely instead of squashing into one line */
      section#top > div:nth-of-type(2) {
        flex-wrap: wrap !important;
        gap: 10px 14px !important;
        justify-content: flex-start !important;
        font-size: 13px !important;
      }

      /* statement subhead row */
      section#top blockquote + div { /* no-op safeguard */ }

      /* tame the chunky offset shadows so nothing pokes past the viewport */
      img, iframe { max-width: 100% !important; }
      [style*="box-shadow"] {
        box-shadow: 6px 6px 0 #283038 !important;
      }

      /* contact CTA */
      a[href*="forms.gle"] {
        font-size: 20px !important;
        padding: 22px 24px !important;
        gap: 14px !important;
      }
      a[href*="forms.gle"] + p { font-size: 15px !important; }

      /* footer — stack the meta row */
      footer > div:last-child {
        flex-direction: column !important;
        gap: 14px !important;
        text-align: center !important;
        align-items: center !important;
      }

      /* fact-list rows (about page) — keep label + value on the same line, smaller */
      section[style*="background: rgb(232, 216, 208)"] span { font-size: 13px !important; }
    }

    /* ---------- TINY PHONE (≤380px) ---------- */
    @media (max-width: 380px) {
      h2 { font-size: 40px !important; }
      h3 { font-size: 34px !important; }
      blockquote { font-size: 20px !important; }
      nav a { font-size: 10px !important; letter-spacing: .1em !important; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script src="site-data.js"></script>
  <script type="text/babel" src="direction-playbill.jsx"></script>

  <script type="text/babel" data-presets="react">
    ReactDOM.createRoot(document.getElementById("root")).render(<DirectionPlaybill />);
  </script>
</body>
</html>
